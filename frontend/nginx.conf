server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # REST API and OpenAPI documentation: proxied to the back end
  location ~ ^/(api|v3/api-docs|swagger-ui) {
    proxy_pass http://back:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Chat WebSocket: the Upgrade header must be forwarded, otherwise the connection fails
  location /ws {
    proxy_pass http://back:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Angular application: any other URL returns index.html (client-side routing)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Files fingerprinted by the build: long-lived cache
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
