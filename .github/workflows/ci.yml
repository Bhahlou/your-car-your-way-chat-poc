name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Back-end (tests Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Docker is preinstalled on the runners: Testcontainers starts a real PostgreSQL 18
      - run: ./mvnw -B verify

  frontend:
    name: Front-end (tests et build Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production # fails if a size budget is exceeded
